<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061726" />
    <script>
      // Set the palette before React mounts to avoid a light-theme flash.
      try {
        const saved = localStorage.getItem("kalyan-portfolio-palette");
        const palettes = {
          crimson: "#061726", ocean: "#041226", cyan: "#010310",
          cream: "#FFF0BA", mauve: "#441541", fuchsia: "#100E55",
          yellow: "#240E4E"
        };
        const palette = Object.prototype.hasOwnProperty.call(palettes, saved)
          ? saved : "crimson";
        document.documentElement.dataset.palette = palette;
        document.documentElement.dataset.theme = palette === "cream" ? "light" : "dark";
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", palettes[palette]);
      } catch {
        document.documentElement.dataset.palette = "crimson";
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="Kalyana Sundaram V's portfolio: gameplay engineering, rapid prototypes, Unity production pipelines, and practical Windows and Android tools."
    />
