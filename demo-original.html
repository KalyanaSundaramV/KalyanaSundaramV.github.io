<script id="embedded-3d-starter">

    let count=0;
    const tick=setInterval(()=>{
      count++;
      if(document.querySelector('#interactive-demo') && count>3){
        clearInterval(tick);
        setTimeout(()=>window.dispatchEvent(new Event('portfolio-demo-play-request')),550);
      }
      if(count>150)clearInterval(tick);
    },130);
  });
}
